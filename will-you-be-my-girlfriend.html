<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Question 💌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FFF8FA;
    --blush: #FFC2D1;
    --pink-soft: #FFE0EB;
    --pink-accent: #FF6B9D;
    --plum: #6B3F52;
    --plum-light: #9C6B7E;
    --gold: #FFD166;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow-x: hidden;
  }

  body {
    min-height: 100vh;
    background: radial-gradient(ellipse at top, var(--pink-soft) 0%, var(--cream) 60%);
    font-family: 'Quicksand', sans-serif;
    position: relative;
  }

  .stage {
    position: relative;
    width: 100%;
    min-height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* floating ambient hearts */
  .ambient-heart {
    position: absolute;
    top: -40px;
    font-size: 22px;
    color: var(--blush);
    opacity: 0.55;
    animation: floatDown linear infinite;
    pointer-events: none;
    z-index: 0;
    user-select: none;
  }

  @keyframes floatDown {
    0%   { transform: translateY(-5vh) translateX(0) rotate(0deg); }
    100% { transform: translateY(105vh) translateX(20px) rotate(25deg); }
  }

  .card {
    position: relative;
    z-index: 2;
    background: #ffffffcc;
    backdrop-filter: blur(6px);
    border-radius: 32px;
    padding: 56px 44px 48px;
    max-width: 420px;
    width: 90%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(255, 107, 157, 0.25), 0 2px 8px rgba(107, 63, 82, 0.08);
    border: 1px solid #ffffff;
    transition: transform 0.4s ease;
  }

  .card.answered {
    animation: cardPulse 0.6s ease;
  }

  @keyframes cardPulse {
    0%   { transform: scale(1); }
    35%  { transform: scale(1.04); }
    100% { transform: scale(1); }
  }

  .eyebrow {
    font-size: 14px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--pink-accent);
    font-weight: 600;
    margin-bottom: 14px;
  }

  h1 {
    font-family: 'Fredoka', sans-serif;
    font-size: 30px;
    line-height: 1.3;
    color: var(--plum);
    margin: 0 0 12px;
    font-weight: 600;
  }

  .subtitle {
    font-size: 16px;
    color: var(--plum-light);
    margin: 0 0 34px;
    line-height: 1.5;
  }

  .big-heart {
    font-size: 46px;
    display: block;
    margin-bottom: 6px;
    animation: heartbeat 1.6s ease-in-out infinite;
  }

  @keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    15%      { transform: scale(1.18); }
    30%      { transform: scale(1); }
    45%      { transform: scale(1.12); }
    60%      { transform: scale(1); }
  }

  .button-row {
    position: relative;
    display: flex;
    gap: 18px;
    justify-content: center;
    align-items: center;
    min-height: 60px;
  }

  button {
    font-family: 'Fredoka', sans-serif;
    font-size: 17px;
    font-weight: 600;
    border: none;
    border-radius: 999px;
    padding: 15px 30px;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  button:focus-visible {
    outline: 3px solid var(--pink-accent);
    outline-offset: 3px;
  }

  #yesBtn {
    background: linear-gradient(135deg, var(--pink-accent), #ff8fb3);
    color: white;
    box-shadow: 0 10px 24px rgba(255, 107, 157, 0.4);
  }

  #yesBtn:hover {
    transform: translateY(-2px) scale(1.03);
    box-shadow: 0 14px 30px rgba(255, 107, 157, 0.5);
  }

  #yesBtn.grown {
    padding: 22px 46px;
    font-size: 20px;
  }

  #noBtn {
    background: var(--pink-soft);
    color: var(--plum);
    position: relative;
  }

  #noBtn.escaping {
    position: absolute;
    transition: top 0.18s ease, left 0.18s ease;
  }

  .answer-text {
    font-family: 'Fredoka', sans-serif;
    font-size: 20px;
    color: var(--pink-accent);
    margin-top: 22px;
    min-height: 28px;
    font-weight: 600;
  }

  .no-taps-hint {
    font-size: 13px;
    color: var(--plum-light);
    margin-top: 16px;
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .no-taps-hint.show { opacity: 0.85; }

  /* confetti + hearts burst */
  .burst-piece {
    position: absolute;
    top: -20px;
    z-index: 5;
    pointer-events: none;
    will-change: transform;
  }

  @media (max-width: 480px) {
    .card { padding: 44px 24px 38px; }
    h1 { font-size: 25px; }
  }
</style>
</head>
<body>
<div class="stage" id="stage">

<div class="card" id="card">
  <span class="big-heart">💗</span>
  <div class="eyebrow">One small question</div>
  <h1 id="question">Would you like to be my girlfriend?</h1>
  <p class="subtitle" id="subtitle">Take your time thinking about it... though there's really only one right answer 😌</p>

  <div class="button-row">
    <button id="yesBtn" onclick="sayYes()">Yes 💕</button>
    <button id="noBtn" onmouseover="dodge(event)" onclick="dodge(event)" ontouchstart="dodgeTouch(event)">No</button>
  </div>

  <div class="answer-text" id="answerText"></div>
  <div class="no-taps-hint" id="hint">it's not you missing the click, the button's just being difficult 😉</div>
</div>

</div>

<script>
  // ambient falling hearts in background
  const heartsPool = ['💗','💕','💖','🩷','💞'];
  const ambientLayer = document.getElementById('stage');
  for (let i = 0; i < 14; i++) {
    const h = document.createElement('div');
    h.className = 'ambient-heart';
    h.textContent = heartsPool[Math.floor(Math.random() * heartsPool.length)];
    h.style.left = Math.random() * 100 + 'vw';
    h.style.fontSize = (16 + Math.random() * 18) + 'px';
    h.style.animationDuration = (10 + Math.random() * 12) + 's';
    h.style.animationDelay = (Math.random() * 10) + 's';
    ambientLayer.appendChild(h);
  }

  const noBtn = document.getElementById('noBtn');
  const yesBtn = document.getElementById('yesBtn');
  const card = document.getElementById('card');
  const hint = document.getElementById('hint');
  const subtitle = document.getElementById('subtitle');
  const answerText = document.getElementById('answerText');

  let dodgeCount = 0;
  let answered = false;

  const stage = document.getElementById('stage');

  function dodge(e) {
    if (answered) return;
    dodgeCount++;

    const stageRect = stage.getBoundingClientRect();
    const rect = noBtn.getBoundingClientRect();
    const btnWidth = rect.width;
    const btnHeight = rect.height;
    const margin = 16;

    // convert button position into stage-local coordinates
    let localLeft = rect.left - stageRect.left;
    let localTop = rect.top - stageRect.top;

    if (!noBtn.classList.contains('escaping')) {
      // reparent into stage so its containing block matches the coordinates we compute
      // (previously it stayed inside .card, which is also position:relative — mismatch!)
      stage.appendChild(noBtn);
      noBtn.style.left = localLeft + 'px';
      noBtn.style.top = localTop + 'px';
      noBtn.classList.add('escaping');
    }

    const centerX = localLeft + btnWidth / 2;
    const centerY = localTop + btnHeight / 2;

    // pointer position, also converted to stage-local coordinates
    let pointerX = centerX, pointerY = centerY;
    if (e) {
      let clientX, clientY;
      if (e.touches && e.touches[0]) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
      } else if (typeof e.clientX === 'number') {
        clientX = e.clientX;
        clientY = e.clientY;
      }
      if (typeof clientX === 'number') {
        pointerX = clientX - stageRect.left;
        pointerY = clientY - stageRect.top;
      }
    }

    // base direction: away from the pointer, plus random jitter so it's never the same move twice
    let angle = Math.atan2(centerY - pointerY, centerX - pointerX);
    angle += (Math.random() - 0.5) * (Math.PI / 1.6); // up to ~56° jitter either side

    // shorter, more clustered hop instead of a big cross-screen leap
    const distance = 70 + Math.random() * 90;

    let newX = localLeft + Math.cos(angle) * distance;
    let newY = localTop + Math.sin(angle) * distance;

    // clamp within the stage's own measured size — always matches what's actually rendered
    const maxX = Math.max(margin, stageRect.width - btnWidth - margin);
    const maxY = Math.max(margin, stageRect.height - btnHeight - margin);

    newX = Math.max(margin, Math.min(newX, maxX));
    newY = Math.max(margin, Math.min(newY, maxY));

    noBtn.style.left = newX + 'px';
    noBtn.style.top = newY + 'px';

    if (dodgeCount === 3) {
      hint.classList.add('show');
    }

    // yes button grows a little each time, gently encouraging the obvious choice
    const growth = Math.min(dodgeCount, 6);
    yesBtn.style.transform = `scale(${1 + growth * 0.035})`;
    if (growth >= 6) yesBtn.classList.add('grown');
  }

  function dodgeTouch(e) {
    e.preventDefault();
    dodge(e);
  }

  function sayYes() {
    if (answered) return;
    answered = true;
    card.classList.add('answered');
    subtitle.textContent = "Knew you'd say that 🥰";
    document.getElementById('question').textContent = "Yaaay! 🎉";
    answerText.textContent = "It's official now 💑";
    noBtn.style.display = 'none';
    yesBtn.disabled = true;
    yesBtn.style.opacity = '0.9';
    launchCelebration();
  }

  function launchCelebration() {
    const pieces = ['💗','💕','💖','🩷','🎉','✨','💞'];
    const colors = ['#FF6B9D', '#FFC2D1', '#FFD166', '#ff8fb3'];
    const total = 60;

    for (let i = 0; i < total; i++) {
      setTimeout(() => {
        const el = document.createElement('div');
        el.className = 'burst-piece';
        const isHeart = Math.random() > 0.4;
        el.style.left = Math.random() * 100 + 'vw';
        el.style.fontSize = (14 + Math.random() * 16) + 'px';

        if (isHeart) {
          el.textContent = pieces[Math.floor(Math.random() * pieces.length)];
        } else {
          el.style.width = '8px';
          el.style.height = '14px';
          el.style.background = colors[Math.floor(Math.random() * colors.length)];
          el.style.borderRadius = '2px';
        }

        stage.appendChild(el);

        const duration = 2200 + Math.random() * 1800;
        const drift = (Math.random() - 0.5) * 200;
        const rotate = Math.random() * 720 - 360;

        el.animate([
          { transform: 'translate(0, -20px) rotate(0deg)', opacity: 1 },
          { transform: `translate(${drift}px, 105vh) rotate(${rotate}deg)`, opacity: 0.9 }
        ], {
          duration: duration,
          easing: 'cubic-bezier(0.25, 0.46, 0.45, 0.94)'
        });

        setTimeout(() => el.remove(), duration + 100);
      }, i * 35);
    }
  }
</script>

</body>
</html>
